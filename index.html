<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Portal do Estudante Público</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card-cadastro {
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn-principal {
            background-color: #2c3e50;
            color: white;
            border: none;
        }
        .btn-principal:hover {
            background-color: #1a252f;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card card-cadastro p-4 bg-white">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <div class="display-1 text-success">🏫</div>
                        <h2 class="card-title fw-bold">Portal do Estudante</h2>
                        <p class="text-muted">Acesso exclusivo para Rede Pública</p>
                    </div>

                    <form action="portal.html" method="get">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control form-control-lg" id="nome" name="nome" placeholder="Ex: João Silva" required>
                        </div>

                        <div class="mb-3">
                            <label for="codigo" class="form-label">Código do Aluno (RA/Matrícula)</label>
                            <input type="text" class="form-control form-control-lg" id="codigo" placeholder="000.123.456-SP" required>
                        </div>

                        <div class="mb-4">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" class="form-control form-control-lg" id="senha" placeholder="******" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-principal btn-lg">Entrar no Portal</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <a href="#" class="text-decoration-none text-muted small">Esqueceu a senha?</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.min.js"></script>
</body>
</html>
